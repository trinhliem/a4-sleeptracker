<ion-tabs>
  <!--- Data Page -->
  <ion-tab tab="data">

    <div id="home-page" class="ion-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>See Data</ion-title>
        </ion-toolbar>
      </ion-header>

      <!--- Page Content-->
      <ion-content>
        <div style="display: flex; align-items: center; justify-content: center;">Data content</div>
      </ion-content>
    </div>

  </ion-tab>

  <!--- Loging Page-->
  <ion-tab tab="log">
    <div id="home-page" class="ion-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>Log Data</ion-title>
        </ion-toolbar>
      </ion-header>

      <!--- Page Content-->
      <ion-content>
        <ion-button (click)="LogSleep()">Log Sleep</ion-button>
        <ion-button (click)="LogGrog()">Log Grogginess</ion-button>

        @if(sleepLogging)
        {
          <!-- Log Sleep Mode -->
          <div>Currently Logging Sleep</div>
          <ion-input label="Enter data", inputmode="numeric", maxlength="2"></ion-input>
        } @else {

          <!-- Log Grogginess Mode -->
          <div>Currently Logging Grogginess</div>
          <ion-range [ticks]="true" [snaps]="true" [min]="0" [max]="7">
          </ion-range>
        }

      </ion-content>
    </div>

  </ion-tab>

<!--- Navigation Tabs-->
  <ion-tab-bar slot="bottom">
    
    <!--- Data page -->
    <ion-tab-button tab="data">
      <ion-label class="color-white">Data</ion-label>
    </ion-tab-button>

    <!--- Log page -->
    <ion-tab-button tab="log">
      <ion-label class="color-white">Log</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
