<!--- Sleep Data Visuals + Content -->
<ion-content class="ion-padding">
  <div>
    <h1  class="greeting-text">{{ greeting }}</h1>
  </div>

  <div class="ion-align-items-center ion-margin-top">
    <ion-item>
        <ion-datetime presentation="date" [value]="currentDate" [highlightedDates]="highlightedDates"
        (ionChange)="onDateChange($event)"></ion-datetime>
    </ion-item>

    <ion-item>
      <ion-label>
        <h2>Sleep Data</h2>
        @if (selectedSleepRecord) {
          <p>{{ selectedSleepRecord.summaryString() }}</p>
        } @else {
          <p>No sleep data logged for {{ selectedReadableDate }}.</p>
        }
      </ion-label>
    </ion-item>

    <!-- sleep overnight chart goes here -->
    <div class="sleep-chart-card">
      <div class="chart-header">
      </div>

      <div #sleepChartContainer class="chart-canvas"></div>
    </div>

    <ion-item>
      <ion-label>
        <h2>Sleepiness Data</h2>
        <p>Sleepiness data for {{ selectedReadableDate }} here</p>
      </ion-label>
    </ion-item>
  </div>
</ion-content>
