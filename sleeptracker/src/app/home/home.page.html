<!--- Sleep Data Visuals + Content -->
<ion-content class="ion-padding">
  <div>
    <h1  class="greeting-text">{{ greeting }}</h1>
  </div>

  <div class="ion-align-items-center ion-margin-top">
    <ion-item>
      <ion-datetime presentation="date" [value]="currentDate" (ionChange)="onDateChange($event)"></ion-datetime>
    </ion-item>

    <ion-item>
      <ion-label>
        <h2>Sleep Data</h2>
        <p>Sleep data for {{ selectedReadableDate }} here</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <h2>Sleepiness Data</h2>
        <p>Sleepiness data for {{ selectedReadableDate }} here</p>
      </ion-label>
    </ion-item>
  </div>
</ion-content>
