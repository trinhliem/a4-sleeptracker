<ion-content class="ion-padding">
  <!-- bedtime step -->
  @if (currentStep === 1) {
    <div class="step-card">
      <h2 class="center-align">When did you go to bed?</h2>
      <ion-item lines="none">
      <ion-datetime-button datetime="bedtime" ></ion-datetime-button>
      </ion-item>
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="bedtime" [(ngModel)]="bedtime"></ion-datetime>
        </ng-template>
      </ion-modal>
      <div class="button-row center-align">
        <ion-button (click)="nextStep()">Next &rarr;</ion-button>
      </div>
    </div>
  }
  @else if (currentStep === 2) { <!-- wake time step -->
    <div class="step-card slide-in-right">
    <h2 class="center-align">When did you get out of bed?</h2>
      <ion-item lines="none">
        <ion-datetime-button datetime="waketime"></ion-datetime-button>
      </ion-item>
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="waketime" [(ngModel)]="wakeup"></ion-datetime>
        </ng-template>
      </ion-modal>
      <div class="button-row center-align">
        <ion-button fill="outline" (click)="prevStep()">&larr; Back</ion-button>
        <ion-button color="primary" (click)="save()">Log Sleep</ion-button>
      </div>
    </div>
  }

</ion-content>
