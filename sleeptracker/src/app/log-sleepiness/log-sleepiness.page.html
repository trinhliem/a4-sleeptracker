<ion-content class="ion-padding-horizontal">
    <div class="center-align">
        <h1>How sleepy are you right now?</h1>
    </div>
    <h2>Level {{ rating }}</h2>
    <p  class="scale-description">{{ getScaleDescription(rating)}}</p>
    <ion-range
            [(ngModel)]="rating"
            (ionChange)="onSliderChange($event)"
            [ticks]="true"
            [snaps]="true"
            [min]="1"
            [max]="7">
    </ion-range>
    <ion-button expand="block" class="log-btn" (click)="save()">Add</ion-button>
</ion-content>
