<ion-content class="ion-padding-horizontal">
    <div class="center-align">
        <h2>How sleepy are you right now?</h2>
    </div>
    <h1>Level {{ rating }}</h1>
    <p>{{ getScaleDescription(rating)}}</p>
    <ion-range
            [(ngModel)]="rating"
            (ionChange)="onSliderChange($event)"
            [ticks]="true"
            [snaps]="true"
            [min]="1"
            [max]="7">
    </ion-range>
    <ion-button expand="block" class="log-btn" (click)="save()">Add</ion-button>
</ion-content>
